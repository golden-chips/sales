server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;           # Excel import (8 MB) + documents
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  # ZKTeco fingerprint devices (ADMS / iclock protocol)
  location /iclock/ {
    proxy_pass http://api:4000;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /health { proxy_pass http://api:4000; }

  # the app shell and service worker must never be cached, so updates reach users
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
